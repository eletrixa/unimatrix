name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - name: Run gate
        run: ./check.sh
