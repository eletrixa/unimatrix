# Readyroom profile — deep-research + decision swarms (readyroom:research / :decision / :ceo)
# Project: unimatrix — multi-model swarm orchestration from Claude Code
# Module:  profiles/readyroom.conf
# Deps:    consumed by conf_load (src/swarm-lib.sh) via the CONF env var; reads READYROOM_JUDGE at source time
# Tested:  tests/readyroom-profile.bats
#
# Key responsibilities:
#  • glm-led exec with grok as the web-capable second lane; long-card timeouts for research work
#  • READYROOM_JUDGE=opus (default) | codex flips the review seat + codex's judge in one env var
#  • Web-capable READ-ONLY grok cards via GROK_TOOLS (write cards carry web by default already)
#
# Design constraints:
#  • PLAN stays `fable`: a seated non-fable PLAN lane is banned from ALL judging by `_judge_ok`.
#  • READYROOM_JUDGE is NOT a CONF_KEY — export it in the launch env or the default (opus) applies.
#  • Bulk executors verify on codex in BOTH judge modes (cost floor: the verify wave fires per done
#    card). Opus quality lives in explicitly seeded judge-seat cards, pinned `claude:opus` via
#    `.lane` at seeding time; those get a codex cross-check through `claude:codex`. High-stakes
#    escape hatch: override VERIFY_MAP in the launch env (env > conf).
#  • Sits NEXT TO profiles/thrifty.conf (dev builds) — sibling profiles on the same CONF mechanism.

PLAN=fable
ORCHESTRATOR=fable
EXEC_CHAIN="glm:glm-5.2 grok:grok-4.5 codex:default claude:haiku"
CLASS_EXEC="glm grok"
FANOUT=6
LANE_MAX_GLM=4
LANE_MAX_GROK=4
LANE_MAX_CLAUDE=2  # opus judge cards may run 2-wide; never a burst lane
WORKER_TIMEOUT_SEC=1200  # research cards are long; glm done-median 401s is the floor, not typical
TIMEOUT_GROK=1500  # web cards: 11-16 searches each (grpnrev 2026-07-24 evidence)
TIMEOUT_CODEX=600  # verify cards read long evidence files
TIMEOUT_CLAUDE=1200  # opus judges read facts.json + full evidence sets
MAX_LANE_RETRIES=2
BUDGET_USD=5  # belt: caps any pinned PAYG kimi card
PAYG_FALLBACK=deny
POOL_LINGER_SEC=180  # evidence → verify → judge waves reuse one pool
MON_AUTOOPEN=0
GROK_EFFORT=  # empty = restore grok's own high-effort default (research quality > speed)
GROK_TOOLS=read_file,grep,list_dir,web_search,web_fetch  # web-capable read-only grok cards (tricorder)

# READYROOM_JUDGE=opus (default) | codex — the one switch for all judge seats (Rob, 2026-08-04).
# conf_load SOURCES this file, so this conditional runs at load; env-set REVIEW/VERIFY_MAP still
# win via the FR-1 re-overlay.
if [[ "${READYROOM_JUDGE:-opus}" == "codex" ]]; then
  REVIEW=codex:default
  CLASS_REVIEW="codex glm"
  VERIFY_MAP="glm:codex grok:codex claude:codex gemini:codex kimi:codex codex:glm"
else
  REVIEW=claude:opus
  CLASS_REVIEW="claude codex"  # claude review/verify seats resolve to opus via _verify_default_model
  VERIFY_MAP="glm:codex grok:codex claude:codex gemini:codex kimi:codex codex:claude"
fi
