# Thrifty profile — minimum-Anthropic swarm configuration for cost-optimized multi-model orchestration
# Project: unimatrix — multi-model swarm orchestration from Claude Code
# Module:  profiles/thrifty.conf
# Deps:    consumed by conf_load (src/swarm-lib.sh) via the CONF env var
# Tested:  tests/thrifty-profile.bats
#
# Key responsibilities:
#  • Define exec lanes and their limits to minimize Anthropic spend (haiku-only for Claude, zero judge seats)
#  • Route planning to Fable and verification/review to cost-optimized model pairs (GLM→Codex, Grok→Codex)
#  • Enforce budget caps and retry policy to bound monthly P&L
#
# Design constraints:
#  • PLAN stays `fable` on purpose: a seated non-fable PLAN lane is disqualified from ALL judging by `_judge_ok` — codex plans via a delegated card instead (see profiles/thrifty/plan-request.md).
#  • Zero claude judge seats and no sonnet/opus anywhere: Anthropic spend is the orchestrator session only.
#  • Usage: `CONF=$UNIMATRIX_HOME/profiles/thrifty.conf` in the launch env — swarm.conf itself is never edited.

PLAN=fable
ORCHESTRATOR=fable
REVIEW=codex:default
EXEC_CHAIN="glm:glm-5.2 grok:grok-4.5 codex:default claude:haiku"  # glm-led: z.ai coding plan ≈ zero marginal; grok rung 2 absorbs spillover
CLASS_EXEC="glm grok"
CLASS_REVIEW="codex glm"  # kimi out — dead balance 2026-07-26; glm is codex's judge + review failover
VERIFY_MAP="glm:codex grok:codex claude:codex gemini:codex kimi:codex codex:glm"
FANOUT=6
LANE_MAX_GLM=4
LANE_MAX_GROK=4
LANE_MAX_CLAUDE=1  # haiku = last-resort rung, never a burst
WORKER_TIMEOUT_SEC=900  # glm honest-slow, done-median ~401s
TIMEOUT_CODEX=300
MAX_LANE_RETRIES=2
BUDGET_USD=5  # belt: caps any pinned PAYG kimi card
PAYG_FALLBACK=deny  # deny PAYG fallback hops
POOL_LINGER_SEC=120
MON_AUTOOPEN=0
